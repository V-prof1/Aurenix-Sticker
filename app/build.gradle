plugins { id 'com.android.application' }
android {
 namespace 'com.aurenix.sticker'
 compileSdk 35
 defaultConfig { applicationId 'com.aurenix.sticker'; minSdk 29; targetSdk 34; versionCode 15; versionName '1.4-android-test' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = ["$buildDir/generated/web"] } }
}
tasks.register('copyEditor', Copy) { from rootProject.file('index.html'); into layout.buildDirectory.dir('generated/web') }
tasks.named('preBuild').configure { dependsOn 'copyEditor' }
dependencies { implementation 'androidx.media3:media3-transformer:1.5.1' }
