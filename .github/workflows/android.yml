name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          java -version
          sdkmanager --list_installed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          gradle --version
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee dist/gradle-build.log
      - name: Prepare download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/Aurenix-Sticker-V1.4-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aurenix-Sticker-APK
          path: dist/Aurenix-Sticker-V1.4-Android.apk
          if-no-files-found: error
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aurenix-build-log
          path: dist/gradle-build.log
          if-no-files-found: ignore
