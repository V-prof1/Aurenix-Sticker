name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          java -version
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$MANAGER" ]]; then
              MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            fi
            test -x "$MANAGER"
            # Ignore yes receiving SIGPIPE after sdkmanager finishes accepting licenses.
            set +o pipefail
            yes | "$MANAGER" --sdk_root="$SDK" --licenses
            set -o pipefail
            "$MANAGER" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          gradle --version
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee dist/gradle-build.log
      - name: Prepare download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/Aurenix-Sticker-V1.4-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aurenix-Sticker-APK
          path: dist/Aurenix-Sticker-V1.4-Android.apk
          if-no-files-found: error
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aurenix-build-log
          path: dist/gradle-build.log
          if-no-files-found: ignore
